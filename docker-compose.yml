networks:
  rag-network:
    name: rag-network
    driver: bridge

services:
  langgraph:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: langgraph-runner
    image: custom-rag-agent-langgraph:latest
    container_name: rag-langgraph
    networks:
      - rag-network
    ports:
      - "2024:2024"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - VECTOR_WALLET_DIR=/app/wallet
      - OCI_KEY_FILE=/run/secrets/oci_api_key
      - OTEL_EXPORTER_OTLP_LOGS_ENDPOINT=http://otel-collector:4318/v1/logs
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://otel-collector:4318/v1/traces
      - LANGFUSE_HOST=http://langfuse-web:3000
      - LANGFUSE_UI_URL=http://localhost:3300
      - GRAFANA_URL=http://localhost:3051
      - MCP_USE_ANONYMIZED_TELEMETRY=false
      - SCARF_NO_ANALYTICS=true
      - DO_NOT_TRACK=true
      - POSTHOG_DISABLED=true
      - CORS_ALLOW_ORIGINS=http://localhost:3000,http://localhost:4000,http://localhost:4040,http://127.0.0.1:3000,http://127.0.0.1:4000,http://127.0.0.1:4040
    secrets:
      - oci_api_key
    env_file:
      - .env
    volumes:
      - ./.env:/app/.env:ro
      - ./langgraph.json:/app/langgraph.json:ro
      - ./local-config:/app/local-config:ro
      - ./local-config/wallet:/app/wallet:ro
      - ./.langgraph_api:/app/.langgraph_api
      - ./local-data:/app/.local-data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:2024/docs', timeout=10)",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 120s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_DEFAULT_FLOW_MODE: ${NEXT_PUBLIC_DEFAULT_FLOW_MODE:-mixed}
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:2024}
        NEXT_PUBLIC_LANGGRAPH_API_BASE: ${NEXT_PUBLIC_LANGGRAPH_API_BASE:-http://localhost:2024}
        FASTAPI_BACKEND_URL: http://langgraph:2024
        LANGGRAPH_BACKEND_URL: ${LANGGRAPH_BACKEND_URL:-http://langgraph:2024}
    image: custom-rag-agent-frontend:latest
    container_name: rag-frontend
    networks:
      - rag-network
    ports:
      - "4000:3000"
    environment:
      - FASTAPI_BACKEND_URL=http://langgraph:2024
      - LANGGRAPH_BACKEND_URL=${LANGGRAPH_BACKEND_URL:-http://langgraph:2024}
      - NEXT_PUBLIC_API_BASE=${NEXT_PUBLIC_API_BASE:-http://localhost:2024}
      - NEXT_PUBLIC_LANGGRAPH_API_BASE=${NEXT_PUBLIC_LANGGRAPH_API_BASE:-http://localhost:2024}
      - NEXT_PUBLIC_DEFAULT_FLOW_MODE=${NEXT_PUBLIC_DEFAULT_FLOW_MODE:-mixed}
      - NODE_ENV=production
    depends_on:
      langgraph:
        condition: service_healthy
    restart: unless-stopped

  # Observability stack (optional). Start with: docker compose --profile observability up
  # Disable by omitting the profile. Set ENABLE_OBSERVABILITY_STACK=False in config to avoid auto-starting it from helper scripts.
  loki:
    image: grafana/loki:3.6.5
    container_name: loki
    command: -config.file=/etc/loki/loki.yaml
    volumes:
      - ./observability/loki.yaml:/etc/loki/loki.yaml:ro
    ports:
      - "3100:3100"
    networks:
      - rag-network
    restart: unless-stopped
    profiles:
      - observability

  tempo:
    image: grafana/tempo:2.10.0
    container_name: tempo
    command: -config.file=/etc/tempo/tempo.yaml
    volumes:
      - ./observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
    ports:
      - "3200:3200"
    networks:
      - rag-network
    restart: unless-stopped
    profiles:
      - observability

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.145.0
    container_name: otel-collector
    command: ["--config", "/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4318:4318"
    networks:
      - rag-network
    depends_on:
      - loki
      - tempo
    restart: unless-stopped
    profiles:
      - observability

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3051:3000"
    volumes:
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      - rag-network
    restart: unless-stopped
    profiles:
      - observability

secrets:
  oci_api_key:
    file: ./local-config/oci_api_key.pem
