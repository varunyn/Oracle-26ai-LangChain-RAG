[project]
name = "oracle-26ai-langchain-rag"
version = "0.2.0"
description = "Custom RAG Agent with LangGraph, Oracle 26AI Vector Store, and MCP integration"
readme = "docs/README.md"
requires-python = ">=3.11"
authors = [{ name = "Varun Yadav" }]
keywords = ["rag", "langgraph", "oracle", "vector-search", "mcp", "llm"]

dependencies = [
    # LangChain / LangGraph core
    "langchain==1.3.10",
    "langchain-core==1.4.8",
    "langgraph==1.2.6",
    "langgraph-checkpoint==4.1.1",
    "langgraph-checkpoint-sqlite==3.1.0",
    "langchain-text-splitters>=1.1.0",
    "typing-extensions>=4.15.0",
    # FastAPI / server runtime
    "fastapi==0.135.3",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.8.1",
    "starlette>=0.40.0",
    "uvicorn>=0.35.0",
    # MCP
    "fastmcp>=3.4.0",
    "mcp>=1.17.0,<2.0.0",
    "langchain-mcp-adapters>=0.2.2",
    # Oracle / OCI
    "oci>=2.154.3",
    "oracledb>=3.0.0",
    # Official Oracle LangChain integrations
    "langchain-oci>=0.2.7",
    "langchain-oracledb>=1.5.0",
    # OpenAI integration
    "langchain-openai>=1.3.2",
    # HTTP / networking
    "httpcore>=1.0.7",
    "httpx>=0.28.1",
    "httpx-sse>=0.4.0",
    "requests>=2.32.3",
    # Authentication / security
    "cryptography>=44.0.2",
    "PyJWT>=2.10.1",
    # Observability
    "langfuse==4.9.1",
    "langsmith[otel]==0.7.30",
    # OpenTelemetry for FastAPI and LangChain/LangGraph via LangSmith OTEL; OCI APM supports OTLP
    "opentelemetry-api>=1.42.0",
    "opentelemetry-exporter-otlp>=1.42.0",
    "opentelemetry-instrumentation-asgi>=0.63b0",
    "opentelemetry-instrumentation-fastapi>=0.63b0",
    "opentelemetry-instrumentation-logging>=0.63b0",
    "opentelemetry-instrumentation-requests>=0.63b0",
    "opentelemetry-sdk>=1.42.0",
    # Serialization / configuration / utilities
    "orjson>=3.11.5",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.1.1",
    "PyYAML>=6.0.2",
    "tiktoken>=0.13.0",
]

[project.optional-dependencies]
ingestion = [
    "docling[rapidocr]>=2.93.0",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
]

[project.scripts]
# Entry points for command-line tools (if needed)
# Example: rag-agent = "src.rag_agent.rag_agent:main"

[dependency-groups]
# Group dependencies for different use cases
# Usage: uv sync --group dev
dev = [
    "black>=24.0.0",
    "langgraph-api>=0.10,<0.11",
    "langgraph-cli[inmem]>=0.2.6",
    "mypy>=1.8.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.5.0",
    # Integration testing tooling
    "agentevals>=0.0.9",
    "pytest-recording>=0.13.1",
    "vcrpy>=6.0.1",
]

[tool.uv]
package = false # This is an application, not a package to be installed

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
markers = [
    "integration: run against live graph/API (DB, OCI, MCP); skip in fast CI with -m 'not integration'",
    "vcr: record/replay HTTP via VCR",
    "langsmith: log results to LangSmith when --langsmith-output is provided",
]
addopts = "--record-mode=once"
testpaths = [
    "tests/unit_tests",
    "tests/workflow_tests",
    "tests/integration_tests",
]
filterwarnings = [
    'ignore:mcp_use\.config is deprecated\.:DeprecationWarning',
    'ignore:mcp_use\.connectors is deprecated\.:DeprecationWarning',
    'ignore:mcp_use\.session\.MCPSession is deprecated\.:DeprecationWarning',
    'ignore:Support for class-based `config` is deprecated.*:DeprecationWarning',
    'ignore:Use `streamable_http_client` instead\.:DeprecationWarning',
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]                        # Line too long (handled by formatter)
# E402: imports not at top are required for bootstrap/scripts (sys.path, env) before other imports
[tool.ruff.lint.per-file-ignores]
"api/main.py" = ["E402"]
"mcp_servers/*.py" = ["E402"]
"scripts/*.py" = ["E402"]
"tests/run_*.py" = ["E402"]
"ui/*.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "langchain_oci",
    "langchain_oci.*",
    "langchain_oracledb",
    "langchain_oracledb.*",
    "oci.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true
